services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: surebet
      POSTGRES_PASSWORD: surebet
      POSTGRES_DB: surebet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surebet"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: surebet/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://surebet:surebet@postgres:5432/surebet
    command: ["python", "-m", "surebet.main", "--sport", "football"]
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: surebet/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://surebet:surebet@postgres:5432/surebet
    command: ["python", "-m", "uvicorn", "surebet.dashboard.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
